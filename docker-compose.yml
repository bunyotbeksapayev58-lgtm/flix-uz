version: '3.8'

services:
  bot:
    build: .
    container_name: flixuz_cinema_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    volumes:
      - ./database:/app/database
      - ./backups:/app/backups
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
